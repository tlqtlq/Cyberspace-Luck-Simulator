<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyberspace Luck Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarpanch:wght@400;700;900&family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@400;800&family=Roboto+Mono:ital,wght@0,700;1,700&family=Inter:wght@400;700&family=Josefin+Sans:wght@400;700&family=Roboto:wght@400;700;900&display=swap');
        :root {
            --cyber-blue: #0088ff;
            --cyber-bg: #01040a;
            --navy-relic: #001a4d;
            --navy-glow: rgba(0, 43, 128, 0.8);
            --relic-blue: #001f5e;
            --warp-theme: rgba(0, 255, 255, 0.15);
            --trans-theme: rgba(255, 255, 150, 0.15);
            --neon-glow: #00f2ff;
            --potion-0045B3: rgba(0, 69, 179, 0.25);
        }
        html { font-size: 14px; }
        body {
            background-color: var(--cyber-bg);
            color: white;
            font-family: 'Sarpanch', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            position: fixed;
        }
        @media (max-width: 1024px) {
            #ui-hud, #ui-bottom, #ui-center {
                transform: scale(0.75);
                transform-origin: center;
                width: 133.33% !important;
                left: -16.66% !important;
            }
            #ui-hud { transform-origin: top center; top: 0; }
            #ui-bottom { transform-origin: bottom center; bottom: 0; }
        }
        video::-webkit-media-controls { display: none !important; }
        #orientation-guard {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        @media (max-width: 932px) and (orientation: portrait) {
            #orientation-guard { display: flex; }
        }
        #entry-overlay {
            position: fixed; inset: 0; background: black; z-index: 600;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease; text-align: center; padding: 20px;
        }
        #fullscreen-prompt {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 700;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; backdrop-filter: blur(8px);
        }
        #cinematic-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 500; display: none; opacity: 0;
            transition: opacity 0.4s ease-in-out; cursor: default;
            overflow: hidden;
        }
        #cinematic-video {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            min-width: 100%; min-height: 100%; width: auto; height: auto;
            object-fit: cover; background-color: black; pointer-events: none;
        }
        #skip-hint {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7); font-size: 16px; text-transform: uppercase;
            letter-spacing: 0.2em; pointer-events: auto; z-index: 510;
            background: rgba(0,0,0,0.6); padding: 12px 28px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 40px;
            cursor: pointer; font-weight: 700; backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }
        #skip-hint:hover {
            background: rgba(255,255,255,0.15);
            border-color: white;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        /* Background image container - replaces grid */
        .cyber-grid-container {
            position: absolute; inset: 0; overflow: hidden; z-index: 0;
            background: #01040a;
        }
        .bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            opacity: 0.8;
        }
        .scanline {
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 255, 0.02) 50%);
            background-size: 100% 4px; position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5;
        }
        .digit {
            position: absolute; color: #00f2ff; font-family: 'JetBrains Mono', monospace;
            font-size: 18px; font-weight: bold; pointer-events: none;
            text-shadow: 0 0 10px #00f2ff; animation: rise 4s linear forwards;
            z-index: 3;
        }
        @keyframes rise {
            0% { transform: translateY(110vh); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
        .illusionary-relic {
            font-family: 'Roboto Mono', monospace; font-weight: 700; font-style: italic;
            text-transform: lowercase; color: #ffffff;
            text-shadow: 0 0 10px #000a20, 0 0 30px var(--cyber-blue), 0 0 50px rgba(0, 136, 255, 0.3);
            letter-spacing: -0.02em; -webkit-text-stroke: 1px rgba(0, 162, 255, 0.4);
            paint-order: stroke fill;
        }
        .meta-relic {
            font-family: 'Josefin Sans', sans-serif; font-weight: 700;
            text-transform: lowercase; color: #ffffff;
            text-shadow: 0 0 12px #ffffff, 0 0 25px var(--cyber-blue);
            letter-spacing: 0.05em; 
            -webkit-text-stroke: 1px black;
            paint-order: stroke fill;
        }
        .flicker-char { display: inline-block; transition: color 0.12s ease; }
        .flicker-blue {
            color: var(--cyber-blue) !important;
            text-shadow: 0 0 20px var(--cyber-blue), 0 0 40px #ffffff !important;
            -webkit-text-stroke: 1px rgba(0, 136, 255, 0.9) !important;
        }
        .roll-btn {
            background: #000000; border: 1px solid #ffffff; color: #ffffff;
            font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 0.2em;
            text-shadow: 0 0 8px #ffffff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            transition: all 0.1s; cursor: pointer; text-transform: uppercase;
        }
        .roll-btn:hover { box-shadow: 0 0 30px rgba(255, 255, 255, 0.4); background: #111111; border-color: #00f2ff; text-shadow: 0 0 12px #00f2ff; }
        .roll-btn:active { transform: scale(0.92); background: #ffffff; color: #000000; text-shadow: none; }
        .potion-node {
            border: 1px solid #1e293b; transition: all 0.2s ease;
            background: rgba(0, 0, 0, 0.8); display: flex; align-items: center;
            gap: 12px; padding: 10px 14px; width: 100%;
        }
        .node-warp {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
        }
        .node-warp:hover {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .node-trans {
            border-color: #ffffaa;
            background: rgba(255, 255, 170, 0.1);
        }
        .node-trans:hover {
            border-color: #ffffaa;
            background: rgba(255, 255, 170, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 170, 0.3);
        }
        .node-potion-0045B3 {
            border-color: #0045B3;
            background: rgba(0, 69, 179, 0.15);
        }
        .node-potion-0045B3:hover {
            border-color: #0045B3;
            background: rgba(0, 69, 179, 0.3);
            box-shadow: 0 0 20px rgba(0, 69, 179, 0.4);
        }
        .auto-btn { background: rgba(0, 0, 0, 0.8); border: 1px solid #334155; transition: all 0.3s; cursor: pointer; }
        .auto-btn.active { border-color: #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); background: rgba(21, 128, 61, 0.1); }
        .custom-input {
            background: rgba(0, 10, 30, 0.8); border: 1px solid var(--navy-relic);
            color: #ffffff; font-family: 'JetBrains Mono', monospace; outline: none; width: 100%;
        }
        .hud-label { font-family: 'Inter', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
        .glitch-flash { animation: flash 0.15s ease-out; }
        .trans-flash { animation: flash-yellow 0.15s ease-out; }
        @keyframes flash { 0% { background: #00f2ff; opacity: 0.3; } 100% { background: transparent; opacity: 0; } }
        @keyframes flash-yellow { 0% { background: #ffffaa; opacity: 0.4; } 100% { background: transparent; opacity: 0; } }
        input[type=range] { 
            -webkit-appearance: none; 
            background: transparent; 
            width: 100%;
            height: 24px;
        }
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; 
            height: 4px; 
            background: rgba(0, 242, 255, 0.3); 
            border-radius: 4px; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; 
            height: 18px; 
            width: 18px; 
            border-radius: 50%;
            background: #00f2ff; 
            cursor: pointer; 
            margin-top: -7px; 
            box-shadow: 0 0 12px #00f2ff;
            border: 1px solid white;
        }
        .ui-hidden { opacity: 0 !important; pointer-events: none !important; transition: opacity 0.5s ease; }
        #ui-center { z-index: 550; }
        #roll-log {
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none; z-index: 40; text-transform: uppercase;
            line-height: 1.5; margin-top: 12px;
            text-align: left;
        }
        .log-entry { 
            opacity: 0; 
            transform: translateY(-3px); 
            animation: log-slide 0.3s forwards;
            white-space: nowrap;
            font-size: 9px;
        }
        @media (min-width: 768px) {
            .log-entry { font-size: 11px; white-space: normal; }
        }
        @keyframes log-slide { to { opacity: 1; transform: translateY(0); } }
        .odds-text {
            font-family: 'Roboto', sans-serif !important;
            font-weight: 900 !important;
            letter-spacing: 0.25em !important;
            color: white !important;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
            -webkit-text-stroke: 0px transparent !important;
        }
        .meta-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-top: 8px;
        }
        .meta-stack-label {
            font-size: 8px;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
        }
        .meta-stack-number {
            font-size: 20px;
            font-weight: 800;
            color: white;
            text-shadow: 0 0 5px rgba(0,136,255,0.5);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        @media (min-width: 768px) {
            .meta-stack-label { font-size: 10px; }
            .meta-stack-number { font-size: 28px; }
        }
        .fullscreen-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #334155;
            transition: all 0.3s;
            cursor: pointer;
        }
        .fullscreen-btn.active {
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
            background: rgba(34, 197, 94, 0.1);
        }
        .illusion-cs-btn.active {
            background: linear-gradient(135deg, #001133, #003366, #004499);
            border: 2px solid #001a4d !important;
            box-shadow: 0 0 15px rgba(0, 100, 200, 0.5);
        }
        .meta-cs-btn.active {
            background: linear-gradient(135deg, #001133, #003366, #004499);
            border: 2px solid #001a4d !important;
            box-shadow: 0 0 15px rgba(0, 100, 200, 0.5);
        }
        .pole-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #334155;
            transition: all 0.3s;
            cursor: pointer;
        }
        .pole-btn.active {
            background: linear-gradient(135deg, #ff69b4, #00bfff, #ffffff);
            border-color: #ff69b4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
        }
        .pole-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 4px;
        }
        @media (min-width: 768px) {
            .pole-icon { width: 32px; height: 32px; }
        }
        .led-white {
            background-color: #ffffff !important;
            box-shadow: 0 0 8px #ffffff !important;
        }
        .led-gray {
            background-color: #4a4a4a !important;
            box-shadow: none !important;
        }
        .credit-link {
            font-family: 'Roboto', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }
        .credit-link:hover {
            color: #ff0000;
            text-shadow: 0 0 8px rgba(255,0,0,0.5);
            background: rgba(0,0,0,0.6);
            transform: scale(1.02);
        }
        .youtube-icon {
            width: 16px;
            height: 16px;
            filter: drop-shadow(0 0 2px rgba(255,0,0,0.5));
        }
        @media (min-width: 768px) {
            .youtube-icon { width: 18px; height: 18px; }
        }
        /* Glass overlay for readability */
        .glass-overlay {
            position: absolute;
            inset: 0;
            background: rgba(1, 4, 10, 0.4);
            pointer-events: none;
            z-index: 1;
        }
        #ui-hud, #ui-bottom, #ui-center {
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between">
    <div id="orientation-guard">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00f2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-6 animate-bounce"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        <p class="text-white text-base md:text-lg font-bold tracking-widest uppercase">Rotate to Landscape</p>
    </div>
    
    <div id="entry-overlay">
        <button id="start-btn" onclick="showFullscreenPrompt()" class="roll-btn px-10 py-4 text-lg md:text-xl border-2">Test your cyberspace luck</button>
        <p class="mt-4 text-[10px] md:text-xs text-white/60 tracking-[0.2em] uppercase font-bold flex items-center justify-center gap-2">
            Made by 
            <a href="https://www.youtube.com/@tlq_h" target="_blank" rel="noopener noreferrer" class="credit-link">
                <svg class="youtube-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.376.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.376-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                @tlq_h
            </a>
        </p>
    </div>
    
    <div id="fullscreen-prompt">
        <div class="bg-black/90 border border-cyan-500/30 p-6 md:p-8 rounded-lg max-w-[90%] md:max-w-md backdrop-blur-lg">
            <h2 class="text-xl md:text-2xl font-bold text-cyan-400 mb-4">Enable Fullscreen?</h2>
            <p class="text-white/80 text-sm md:text-base mb-2">Better scaling & quality</p>
            <p class="text-white/50 text-xs mb-6">Enhanced visual experience • Optimized performance</p>
            <div class="flex gap-4 justify-center">
                <button onclick="enterFullscreenAndStart()" class="roll-btn px-6 py-2 text-sm">Yes, Enable</button>
                <button onclick="startAppWithoutFullscreen()" class="roll-btn px-6 py-2 text-sm bg-black/60 border-white/50">No, Thanks</button>
            </div>
        </div>
    </div>
    
    <div id="cinematic-overlay">
        <video id="cinematic-video" playsinline webkit-playsinline muted preload="auto"></video>
        <div id="skip-hint">CLICK HERE TO SKIP</div>
    </div>
    <div id="flash" class="fixed inset-0 pointer-events-none z-[60]"></div>
    
    <!-- Background container with image instead of grid -->
    <div class="cyber-grid-container" id="grid-container">
        <img src="https://files.catbox.moe/9j8mnh.jpg" class="bg-image" alt="background">
        <div class="glass-overlay"></div>
        <div class="scanline"></div>
    </div>

    <div id="ui-hud" class="fixed top-0 left-0 w-full grid grid-cols-3 p-2 md:p-4 z-10 items-start">
        <div class="flex flex-col">
            <div class="border-l-[2px] border-cyan-500/30 pl-3 md:pl-4 bg-black/60 backdrop-blur-md py-1.5 shadow-[0_0_15px_rgba(0,242,255,0.1)]">
                <div class="text-[8px] md:text-[10px] text-cyan-400/50 hud-label mb-0.5">rolls</div>
                <div id="rolls-display" class="text-lg md:text-3xl font-black text-white leading-tight">0</div>
            </div>
            <div id="roll-log"></div>
        </div>
        <div class="flex flex-col items-center justify-center -mt-1">
            <button onclick="resetProgress()" class="px-6 md:px-12 py-2 md:py-3 bg-black/40 border-[1px] border-red-900/50 text-[9px] md:text-[12px] font-bold text-red-900/80 uppercase tracking-widest hover:bg-red-900 hover:text-white transition-colors">RESET</button>
            <div class="font-sans text-[8px] text-white/50 uppercase tracking-widest mt-1">Press R to reset</div>
        </div>
        <div class="border-r-[2px] border-blue-900/40 pr-3 md:pr-4 text-right bg-black/60 backdrop-blur-md py-1.5 shadow-[0_0_15px_rgba(0,31,94,0.1)]">
            <div class="text-[8px] md:text-[10px] text-blue-400/60 hud-label mb-0.5">illusionary count</div>
            <div id="hits-display" class="text-lg md:text-3xl font-black text-[#0088ff] drop-shadow-[0_0_8px_rgba(0,136,255,0.5)] leading-none">0</div>
            <div class="meta-stack">
                <div class="meta-stack-label">META COUNT</div>
                <div id="meta-display" class="meta-stack-number">0</div>
            </div>
        </div>
    </div>

    <div id="ui-center" class="fixed inset-0 flex flex-col items-center justify-center text-center px-4 pointer-events-none">
        <div id="display-window" class="opacity-0 transition-all duration-300 transform scale-95 w-full pointer-events-none">
            <div id="main-output" class="text-3xl md:text-7xl w-full"></div>
            <div id="odds-container" class="mt-4 md:mt-8 flex flex-col items-center justify-center gap-1 opacity-0 transition-opacity duration-700">
                <div id="odds-text" class="text-[10px] md:text-2xl font-black tracking-[0.25em] uppercase odds-text">1 IN 10,000,000</div>
            </div>
        </div>
    </div>

    <div id="ui-bottom" class="fixed bottom-0 left-0 w-full p-2 md:p-4 z-20 flex items-end justify-between pointer-events-none">
        <!-- LEFT SIDE -->
        <div class="flex flex-col gap-2 w-40 md:w-64 pointer-events-auto">
            <button id="pole-device-btn" onclick="togglePoleDevice()" class="pole-btn flex items-center justify-between px-3 md:px-5 py-2 md:py-2.5 w-full">
                <div class="flex items-center gap-2">
                    <img src="https://files.catbox.moe/axy0dl.jpg" class="pole-icon" alt="pole">
                    <div class="flex flex-col text-left">
                        <span class="text-[8px] md:text-[12px] font-bold text-white uppercase leading-none">Pole Light Core Device</span>
                        <span id="pole-status" class="text-[6px] md:text-[10px] text-white/60 uppercase leading-none mt-1">Off</span>
                    </div>
                </div>
                <div id="pole-led" class="w-2 md:w-3 h-2 md:h-3 rounded-full bg-slate-700"></div>
            </button>
            <button onclick="runSim(2000)" class="potion-node node-warp py-2.5 md:py-4">
                <img src="https://i.ibb.co/wrdVKqFG/warp.png" class="w-5 h-5 md:w-8 md:h-8 opacity-80">
                <div class="flex flex-col text-left">
                    <span class="text-[9px] md:text-[14px] font-bold text-cyan-200 uppercase leading-none">Warp Potion</span>
                    <span class="text-[7px] md:text-[11px] text-cyan-500 leading-none mt-1">2,000 skips</span>
                </div>
            </button>
            <button onclick="runSim(10000)" class="potion-node node-potion-0045B3 py-2.5 md:py-4">
                <img src="https://files.catbox.moe/0syqjo.png" class="w-5 h-5 md:w-8 md:h-8 opacity-80" style="border-radius: 4px; object-fit: cover;">
                <div class="flex flex-col text-left">
                    <span class="text-[9px] md:text-[14px] font-bold text-[#4d8cff] uppercase leading-none">Tidal Shifter</span>
                    <span class="text-[7px] md:text-[11px] text-[#4d8cff] leading-none mt-1">10,000 skips</span>
                </div>
            </button>
            <button onclick="runSim(20000, 'trans')" class="potion-node node-trans py-2.5 md:py-4">
                <img src="https://i.ibb.co/KpwmGGG9/trans.png" class="w-5 h-5 md:w-8 md:h-8 opacity-80">
                <div class="flex flex-col text-left">
                    <span class="text-[9px] md:text-[14px] font-bold text-yellow-200 uppercase leading-none">Transcendent</span>
                    <span class="text-[7px] md:text-[11px] text-yellow-500 leading-none mt-1">20,000 skips</span>
                </div>
            </button>
            <button id="auto-roll-btn" onclick="toggleAutoRoll()" class="auto-btn flex items-center justify-between px-3 md:px-5 py-2 md:py-3.5 w-full">
                <div class="flex flex-col text-left">
                    <span class="text-[9px] md:text-[14px] font-bold text-white uppercase leading-none">Auto Roll</span>
                    <span id="auto-status" class="text-[7px] md:text-[11px] text-white/40 uppercase leading-none mt-1">Disabled</span>
                </div>
                <div id="auto-led" class="w-2 md:w-3 h-2 md:h-3 rounded-full bg-slate-700"></div>
            </button>
            <div class="potion-node bg-black/60 flex-col !items-stretch p-2 md:p-3.5 border-cyan-500/10">
                <div class="flex gap-2">
                    <input type="number" id="custom-roll-amount" placeholder="Skips..." class="custom-input p-1.5 text-[9px] md:text-[13px] h-8 md:h-12 px-3">
                    <button onclick="handleCustomRoll()" class="bg-cyan-500/10 border-[1px] border-cyan-500/30 px-2 text-[8px] md:text-[11px] font-bold leading-tight uppercase hover:bg-cyan-500 hover:text-black transition-colors">SKIP</button>
                </div>
            </div>
        </div>
        
        <div class="flex flex-col items-center pointer-events-auto w-[35%] md:w-auto pb-0.5 md:pb-1">
            <button onclick="runSim(1)" class="roll-btn w-full md:w-auto px-6 md:px-20 h-10 md:h-16 text-sm md:text-2xl">ROLL</button>
        </div>
        
        <!-- RIGHT SIDE -->
        <div class="flex flex-col gap-2 w-44 md:w-72 pointer-events-auto">
            <button id="fullscreen-toggle-btn" onclick="toggleFullscreen()" class="fullscreen-btn right-side-btn flex items-center justify-between px-3 md:px-5 py-3 md:py-4 w-full">
                <div class="flex flex-col text-left">
                    <span class="text-[9px] md:text-[15px] font-bold text-white uppercase leading-none">FULLSCREEN</span>
                    <span id="fullscreen-status" class="right-side-status text-[7px] md:text-[11px] text-white/60 uppercase leading-none mt-1">OFF</span>
                </div>
                <div id="fullscreen-led" class="right-side-led w-2.5 md:w-3.5 h-2.5 md:h-3.5 rounded-full bg-slate-700"></div>
            </button>
            <button id="cinematic-meta-btn" onclick="toggleCinematicMode('meta')" class="auto-btn meta-cs-btn active right-side-btn flex items-center justify-between px-3 md:px-5 py-3 md:py-4 w-full">
                <div class="flex flex-col text-left">
                    <span class="text-[9px] md:text-[15px] font-bold text-white uppercase leading-none">META CUTSCENE</span>
                    <span id="cine-meta-status" class="right-side-status text-[7px] md:text-[11px] text-white/60 uppercase leading-none mt-1">On</span>
                </div>
                <div id="cine-meta-led" class="right-side-led w-2.5 md:w-3.5 h-2.5 md:h-3.5 rounded-full bg-gray-500"></div>
            </button>
            <button id="cinematic-illusion-btn" onclick="toggleCinematicMode('illusionary')" class="auto-btn illusion-cs-btn active right-side-btn flex items-center justify-between px-3 md:px-5 py-3 md:py-4 w-full">
                <div class="flex flex-col text-left">
                    <span class="text-[9px] md:text-[15px] font-bold text-white uppercase leading-none">ILLUSIONARY CUTSCENE</span>
                    <span id="cine-illusion-status" class="right-side-status text-[7px] md:text-[11px] text-white/60 uppercase leading-none mt-1">On</span>
                </div>
                <div id="cine-illusion-led" class="right-side-led w-2.5 md:w-3.5 h-2.5 md:h-3.5 rounded-full bg-gray-500"></div>
            </button>
            <div class="bg-black/60 backdrop-blur-md border-[1px] border-cyan-500/20 p-3 md:p-4 flex flex-col gap-3 rounded-md shadow-[0_0_15_rgba(0,242,255,0.05)]">
                <div class="flex items-center gap-3">
                    <span class="text-[9px] md:text-[12px] text-cyan-400/60 uppercase font-bold w-7">BGM</span>
                    <input type="range" id="bgm-vol" min="0" max="100" value="50" oninput="updateBGMVolume(this.value)" class="w-full" ontouchstart="" ontouchmove="">
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-[9px] md:text-[12px] text-cyan-400/60 uppercase font-bold w-7">SFX</span>
                    <input type="range" id="sfx-vol" min="0" max="100" value="50" oninput="updateSFXVolume(this.value)" class="w-full" ontouchstart="" ontouchmove="">
                </div>
            </div>
        </div>
    </div>

    <script>
        let rolls = 0, hits = 0, metaHitsCount = 0;
        const ILLUSIONARY_ODDS = 10000000;
        const META_ODDS = 10000;
        let flickerInterval = null, autoRollInterval = null, isAutoRolling = false, isCinematicPlaying = false;
        let isIllusionaryCinematicEnabled = true, isMetaCinematicEnabled = true;
        let isPoleDeviceEnabled = false;
        let sfxVolume = 0.5, bgmVolume = 0.5;
        let logEntries = [];
        let pendingAura = null;
        let isProcessingAura = false;
        let pendingAuraRollNumber = null;
        let isFullscreen = false;
        
        const illusionarySFX = new Audio('https://pomf2.lain.la/f/vvei5e1c.mov');
        const bgm = new Audio('https://files.catbox.moe/ows91z.mp3');
        const video = document.getElementById('cinematic-video');
        const cinematicOverlay = document.getElementById('cinematic-overlay');
        const rollLog = document.getElementById('roll-log');
        
        illusionarySFX.preload = 'auto'; bgm.preload = 'auto'; bgm.loop = true;

        document.getElementById('skip-hint').addEventListener('click', function(e) {
            e.stopPropagation();
            if (isCinematicPlaying) {
                video.pause();
                video.dispatchEvent(new Event('ended'));
            }
        });

        cinematicOverlay.ondblclick = function(e) {};

        function applyPoleBonus(originalCount) {
            if (!isPoleDeviceEnabled) return originalCount;
            let extraRolls = Math.floor(originalCount / 30) * 5;
            return originalCount + extraRolls;
        }

        function togglePoleDevice() {
            isPoleDeviceEnabled = !isPoleDeviceEnabled;
            const btn = document.getElementById('pole-device-btn');
            const statusSpan = document.getElementById('pole-status');
            const led = document.getElementById('pole-led');
            if (isPoleDeviceEnabled) {
                btn.classList.add('active');
                statusSpan.innerText = "On";
                statusSpan.classList.replace('text-white/60', 'text-pink-400');
                led.className = "w-2 md:w-3 h-2 md:h-3 rounded-full bg-gradient-to-r from-pink-500 to-blue-500 shadow-[0_0_10px_#ff69b4]";
            } else {
                btn.classList.remove('active');
                statusSpan.innerText = "Off";
                statusSpan.classList.replace('text-pink-400', 'text-white/60');
                led.className = "w-2 md:w-3 h-2 md:h-3 rounded-full bg-slate-700 shadow-none";
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    isFullscreen = true;
                    updateFullscreenUI();
                }).catch(err => console.warn("Fullscreen error:", err));
            } else {
                document.exitFullscreen().then(() => {
                    isFullscreen = false;
                    updateFullscreenUI();
                }).catch(err => console.warn("Exit fullscreen error:", err));
            }
        }
        
        function updateFullscreenUI() {
            const btn = document.getElementById('fullscreen-toggle-btn');
            const statusSpan = document.getElementById('fullscreen-status');
            const led = document.getElementById('fullscreen-led');
            if (isFullscreen) {
                btn.classList.add('active');
                statusSpan.innerText = "ON";
                statusSpan.classList.replace('text-white/60', 'text-green-400');
                led.className = "right-side-led w-2.5 md:w-3.5 h-2.5 md:h-3.5 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]";
            } else {
                btn.classList.remove('active');
                statusSpan.innerText = "OFF";
                statusSpan.classList.replace('text-green-400', 'text-white/60');
                led.className = "right-side-led w-2.5 md:w-3.5 h-2.5 md:h-3.5 rounded-full bg-slate-700 shadow-none";
            }
        }
        
        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            updateFullscreenUI();
        });
        
        function showFullscreenPrompt() {
            document.getElementById('fullscreen-prompt').style.display = 'flex';
        }
        
        async function enterFullscreenAndStart() {
            document.getElementById('fullscreen-prompt').style.display = 'none';
            try {
                await document.documentElement.requestFullscreen();
                isFullscreen = true;
                updateFullscreenUI();
            } catch(e) { console.warn("Fullscreen not allowed"); }
            startApp();
        }
        
        function startAppWithoutFullscreen() {
            document.getElementById('fullscreen-prompt').style.display = 'none';
            startApp();
        }

        async function unlockMedia() {
            if (unlocked) return;
            bgm.volume = 0; bgm.play().then(() => { bgm.pause(); bgm.volume = bgmVolume; }).catch(() => {});
            illusionarySFX.volume = 0; illusionarySFX.play().then(() => { illusionarySFX.pause(); illusionarySFX.currentTime = 0; illusionarySFX.volume = sfxVolume; }).catch(() => {});
            unlocked = true;
        }

        function startApp() {
            unlockMedia();
            document.getElementById('entry-overlay').style.opacity = '0';
            setTimeout(() => { 
                document.getElementById('entry-overlay').style.display = 'none'; 
                bgm.play().catch(() => {}); 
            }, 500);
        }

        function addLogEntry(type, rollAt, serialNumber) {
            if (type !== 'illusionary') return;
            const formattedRolls = rollAt.toLocaleString();
            logEntries.unshift({ serial: serialNumber, roll: formattedRolls });
            if (logEntries.length > 5) logEntries.pop();
            rollLog.innerHTML = logEntries.map(entry => 
                `<div class="log-entry">#${entry.serial} ILLUSIONARY AT ${entry.roll} ROLLS</div>`
            ).join('');
        }

        function toggleCinematicMode(type) {
            if (type === 'illusionary') {
                isIllusionaryCinematicEnabled = !isIllusionaryCinematicEnabled;
                const btn = document.getElementById('cinematic-illusion-btn');
                const statusSpan = document.getElementById('cine-illusion-status');
                const led = document.getElementById('cine-illusion-led');
                if (isIllusionaryCinematicEnabled) {
                    btn.classList.add('active');
                    statusSpan.innerText = "On";
                    statusSpan.classList.replace('text-white/40', 'text-white/80');
                    led.className = "right-side-led w-2.5 md:w-3.5 h-2.5 md:h-3.5 rounded-full bg-white shadow-[0_0_8px_#ffffff]";
                } else {
                    btn.classList.remove('active');
                    statusSpan.innerText = "Off";
                    statusSpan.classList.replace('text-white/80', 'text-white/40');
                    led.className = "right-side-led w-2.5 md:w-3.5 h-2.5 md:h-3.5 rounded-full bg-gray-500 shadow-none";
                }
            } else if (type === 'meta') {
                isMetaCinematicEnabled = !isMetaCinematicEnabled;
                const btn = document.getElementById('cinematic-meta-btn');
                const statusSpan = document.getElementById('cine-meta-status');
                const led = document.getElementById('cine-meta-led');
                if (isMetaCinematicEnabled) {
                    btn.classList.add('active');
                    statusSpan.innerText = "On";
                    statusSpan.classList.replace('text-white/40', 'text-white/80');
                    led.className = "right-side-led w-2.5 md:w-3.5 h-2.5 md:h-3.5 rounded-full bg-white shadow-[0_0_8px_#ffffff]";
                } else {
                    btn.classList.remove('active');
                    statusSpan.innerText = "Off";
                    statusSpan.classList.replace('text-white/80', 'text-white/40');
                    led.className = "right-side-led w-2.5 md:w-3.5 h-2.5 md:h-3.5 rounded-full bg-gray-500 shadow-none";
                }
            }
        }

        function processAura() {
            if (pendingAura === null) {
                isProcessingAura = false;
                return;
            }
            if (isCinematicPlaying) return;
            
            const aura = pendingAura;
            const auraRoll = pendingAuraRollNumber;
            pendingAura = null;
            pendingAuraRollNumber = null;
            const isMeta = (aura === 'meta');
            
            const cutsceneEnabled = isMeta ? isMetaCinematicEnabled : isIllusionaryCinematicEnabled;
            
            if (cutsceneEnabled) {
                playCutscene(isMeta, auraRoll);
            } else {
                showRareTitle(aura);
                setTimeout(() => processAura(), 500);
            }
        }
        
        function playCutscene(isMeta, rollNumber) {
            isCinematicPlaying = true; 
            bgm.pause();
            
            document.querySelectorAll('#ui-hud, #ui-bottom, #grid-container').forEach(el => el.classList.add('ui-hidden'));
            cinematicOverlay.style.display = 'block';
            cinematicOverlay.offsetHeight;
            
            setTimeout(async () => {
                cinematicOverlay.style.opacity = '1'; 
                video.muted = false; 
                video.volume = sfxVolume; 
                
                const metaUrl = "https://files.catbox.moe/8ogtw5.mp4";
                const illusionUrl = "https://files.catbox.moe/zs3y1x.mp4";
                
                video.pause();
                video.currentTime = 0;
                video.src = isMeta ? metaUrl : illusionUrl;
                video.load();
                
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.warn("Playback prevented, retrying with mute:", error);
                        video.muted = true;
                        video.play().catch(e => console.warn("Still failed:", e));
                    });
                }
                
                let timeoutId = setTimeout(() => {
                    if (isCinematicPlaying && (video.duration === 0 || video.readyState < 2)) {
                        video.dispatchEvent(new Event('ended'));
                    }
                }, 5000);
                
                video.onended = () => {
                    clearTimeout(timeoutId);
                    cinematicOverlay.style.opacity = '0';
                    setTimeout(() => {
                        cinematicOverlay.style.display = 'none';
                        document.querySelectorAll('#ui-hud, #ui-bottom, #grid-container').forEach(el => el.classList.remove('ui-hidden'));
                        bgm.play().catch(() => {}); 
                        isCinematicPlaying = false;
                        showRareTitle(isMeta ? 'meta' : 'illusionary');
                        processAura();
                    }, 500);
                };
                
                video.onerror = () => {
                    clearTimeout(timeoutId);
                    video.dispatchEvent(new Event('ended'));
                };
            }, 80);
        }

        function clearDisplay() {
            const dw = document.getElementById('display-window'), oc = document.getElementById('odds-container');
            dw.classList.add('opacity-0', 'scale-95'); dw.classList.remove('opacity-100', 'scale-100');
            oc.classList.add('opacity-0'); oc.classList.remove('opacity-100');
            if (flickerInterval) { clearInterval(flickerInterval); flickerInterval = null; }
            isShowingRare = false;
        }

        let isShowingRare = false;
        let rareTimeout = null;
        function showRareTitle(type) {
            if (isShowingRare) return;
            isShowingRare = true;
            
            const mainOutput = document.getElementById('main-output'), 
                  displayWindow = document.getElementById('display-window');
            const oddsEl = document.getElementById('odds-text');
            
            if (type === 'meta') {
                mainOutput.innerHTML = "meta".split('').map(char => `<span class="flicker-char">${char}</span>`).join('');
                mainOutput.className = "text-3xl md:text-7xl meta-relic w-full";
                oddsEl.innerText = "1 IN 10,000";
                oddsEl.classList.add('odds-text');
            } else {
                mainOutput.innerHTML = "illusionary".split('').map(char => `<span class="flicker-char">${char}</span>`).join('');
                mainOutput.className = "text-3xl md:text-7xl illusionary-relic w-full";
                oddsEl.innerText = "1 IN 10,000,000";
                oddsEl.classList.add('odds-text');
            }
            
            document.getElementById('odds-container').classList.remove('opacity-0');
            document.getElementById('odds-container').classList.add('opacity-100');
            
            if (flickerInterval) clearInterval(flickerInterval);
            flickerInterval = setInterval(() => {
                if (type === 'meta') {
                    const chars = mainOutput.querySelectorAll('.flicker-char');
                    chars.forEach(c => c.classList.remove('flicker-blue'));
                } else {
                    const chars = mainOutput.querySelectorAll('.flicker-char');
                    chars.forEach(c => c.classList.remove('flicker-blue'));
                    const rand = Math.floor(Math.random() * chars.length);
                    if (chars[rand]) chars[rand].classList.add('flicker-blue');
                }
            }, 280);
            
            displayWindow.className = "opacity-100 transform scale-100 transition-all duration-300 w-full";
            illusionarySFX.currentTime = 0; illusionarySFX.volume = sfxVolume; illusionarySFX.play().catch(() => {});
            
            const flash = document.getElementById('flash');
            flash.classList.remove('glitch-flash', 'trans-flash');
            void flash.offsetWidth;
            flash.classList.add('glitch-flash');
            
            if (rareTimeout) clearTimeout(rareTimeout);
            rareTimeout = setTimeout(() => {
                if (isShowingRare) {
                    clearDisplay();
                    isShowingRare = false;
                }
            }, 4000);
        }

        function getHitCount(n, p) {
            if (n < 500) {
                let c = 0; for (let i = 0; i < n; i++) if (Math.random() < p) c++;
                return c;
            }
            const lambda = n * p;
            if (lambda < 30) {
                let L = Math.exp(-lambda), k = 0, p_val = 1;
                do { k++; p_val *= Math.random(); } while (p_val > L);
                return k - 1;
            }
            const stdDev = Math.sqrt(lambda);
            const u1 = Math.random(), u2 = Math.random();
            const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            return Math.max(0, Math.floor(z0 * stdDev + lambda));
        }

        function runSim(rawCount, potionType = null) {
            if (isCinematicPlaying) return;
            let count = applyPoleBonus(rawCount);
            
            if (count > 1) {
                const mHits = getHitCount(count, 1/META_ODDS);
                const iHits = getHitCount(count, 1/ILLUSIONARY_ODDS);
                
                let illusionarySerialStart = hits + 1;
                
                for(let i = 0; i < mHits; i++) metaHitsCount++;
                for(let i = 0; i < iHits; i++) {
                    hits++;
                    const serialNumber = illusionarySerialStart + i;
                    const rollAt = rolls + Math.floor(Math.random() * count);
                    addLogEntry('illusionary', rollAt, serialNumber);
                }
                
                rolls += count;
                updateUI();
                
                let topAura = null;
                let topAuraRoll = null;
                if (iHits > 0) {
                    topAura = 'illusionary';
                    topAuraRoll = rolls - count + Math.floor(Math.random() * count);
                } else if (mHits > 0) {
                    topAura = 'meta';
                    topAuraRoll = rolls - count + Math.floor(Math.random() * count);
                }
                
                if (topAura) {
                    if (isShowingRare) {
                        clearDisplay();
                        if (rareTimeout) clearTimeout(rareTimeout);
                        isShowingRare = false;
                    }
                    pendingAura = topAura;
                    pendingAuraRollNumber = topAuraRoll;
                    if (!isProcessingAura && !isCinematicPlaying) {
                        isProcessingAura = true;
                        processAura();
                    } else if (!isProcessingAura && isCinematicPlaying) {
                        isProcessingAura = true;
                    }
                } else {
                    const flash = document.getElementById('flash');
                    flash.classList.remove('glitch-flash', 'trans-flash');
                    void flash.offsetWidth;
                    flash.classList.add(potionType === 'trans' ? 'trans-flash' : 'glitch-flash');
                }
            } else {
                rolls++;
                let rolledMeta = Math.random() < 1/META_ODDS;
                let rolledIllusion = !rolledMeta && Math.random() < 1/ILLUSIONARY_ODDS;
                
                if (rolledMeta || rolledIllusion) {
                    if (rolledMeta) metaHitsCount++;
                    if (rolledIllusion) {
                        hits++;
                        addLogEntry('illusionary', rolls, hits);
                    }
                    updateUI();
                    
                    if (isShowingRare) {
                        clearDisplay();
                        if (rareTimeout) clearTimeout(rareTimeout);
                        isShowingRare = false;
                    }
                    
                    let auraType = rolledIllusion ? 'illusionary' : (rolledMeta ? 'meta' : null);
                    if (auraType) {
                        pendingAura = auraType;
                        pendingAuraRollNumber = rolls;
                        if (!isProcessingAura && !isCinematicPlaying) {
                            isProcessingAura = true;
                            processAura();
                        } else if (!isProcessingAura && isCinematicPlaying) {
                            isProcessingAura = true;
                        }
                    }
                } else {
                    updateUI();
                    if (!isAutoRolling) {
                        const flash = document.getElementById('flash');
                        flash.classList.remove('glitch-flash', 'trans-flash');
                        void flash.offsetWidth;
                        flash.classList.add('glitch-flash');
                    }
                }
            }
        }

        function updateUI() {
            document.getElementById('rolls-display').innerText = rolls.toLocaleString();
            document.getElementById('hits-display').innerText = hits.toLocaleString();
            document.getElementById('meta-display').innerText = metaHitsCount.toLocaleString();
        }

        function toggleAutoRoll() {
            isAutoRolling = !isAutoRolling;
            const btn = document.getElementById('auto-roll-btn'), status = document.getElementById('auto-status'), led = document.getElementById('auto-led');
            if (isAutoRolling) {
                btn.classList.add('active'); status.innerText = "Enabled";
                status.classList.replace('text-white/40', 'text-green-400');
                led.className = "w-2 md:w-3 h-2 md:h-3 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]";
                if (autoRollInterval) clearInterval(autoRollInterval);
                autoRollInterval = setInterval(() => runSim(1), 40);
            } else {
                btn.classList.remove('active'); status.innerText = "Disabled";
                status.classList.replace('text-green-400', 'text-white/40');
                led.className = "w-2 md:w-3 h-2 md:h-3 rounded-full bg-slate-700 shadow-none";
                if (autoRollInterval) {
                    clearInterval(autoRollInterval);
                    autoRollInterval = null;
                }
            }
        }

        function handleCustomRoll() {
            let val = parseInt(document.getElementById('custom-roll-amount').value);
            if (!isNaN(val) && val > 0) runSim(Math.min(val, 150000000));
        }

        function updateSFXVolume(v) { sfxVolume = v/100; illusionarySFX.volume = sfxVolume; video.volume = sfxVolume; }
        function updateBGMVolume(v) { bgmVolume = v/100; bgm.volume = bgmVolume; }

        function resetProgress() {
            rolls = 0; hits = 0; metaHitsCount = 0;
            if (isAutoRolling) toggleAutoRoll();
            pendingAura = null;
            pendingAuraRollNumber = null;
            isProcessingAura = false;
            if (isCinematicPlaying) {
                video.pause();
                video.currentTime = 0;
                cinematicOverlay.style.opacity = '0';
                setTimeout(() => {
                    cinematicOverlay.style.display = 'none';
                    document.querySelectorAll('#ui-hud, #ui-bottom, #grid-container').forEach(el => el.classList.remove('ui-hidden'));
                    bgm.play().catch(() => {});
                    isCinematicPlaying = false;
                }, 100);
            }
            if (isShowingRare) {
                clearDisplay();
                if (rareTimeout) clearTimeout(rareTimeout);
                isShowingRare = false;
            }
            logEntries = []; rollLog.innerHTML = '';
            updateUI();
        }

        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'r') resetProgress(); });
        
        const container = document.getElementById('grid-container');
        setInterval(() => {
            if (document.hidden || isCinematicPlaying) return;
            const d = document.createElement('div');
            d.className = 'digit'; d.innerText = Math.round(Math.random());
            d.style.left = Math.random() * 100 + 'vw';
            container.appendChild(d);
            setTimeout(() => d.remove(), 4000);
        }, 150);

        let unlocked = false;
        window.addEventListener('mousedown', unlockMedia);
        window.addEventListener('touchstart', unlockMedia);
    </script>
</body>
</html>
